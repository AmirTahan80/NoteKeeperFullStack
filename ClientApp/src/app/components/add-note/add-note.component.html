<!-- add-note.component.html -->
<div class="container">
    <mat-card>
      <mat-card-header>
        <mat-card-title>افزودن جزوه جدید</mat-card-title>
      </mat-card-header>
  
      <mat-card-content>
        <form [formGroup]="noteForm" (ngSubmit)="onSubmit()" class="note-form">
          <!-- Rich Text Editor -->
          <div class="editor-container">
            <label class="form-label">توضیحات یا جزوه</label>
            <mat-card class="editor-card">
              <mat-card-content>
                <div class="editor-toolbar">
                  <div class="toolbar-group">
                    <button mat-icon-button type="button" (click)="formatDoc('bold')" matTooltip="پررنگ">
                      <mat-icon>format_bold</mat-icon>
                    </button>
                    <button mat-icon-button type="button" (click)="formatDoc('italic')" matTooltip="مورب">
                      <mat-icon>format_italic</mat-icon>
                    </button>
                    <button mat-icon-button type="button" (click)="formatDoc('underline')" matTooltip="زیرخط">
                      <mat-icon>format_underline</mat-icon>
                    </button>
                  </div>
  
                  <div class="toolbar-divider"></div>
  
                  <div class="toolbar-group">
                    <button mat-icon-button type="button" (click)="formatDoc('justifyRight')" matTooltip="راست چین">
                      <mat-icon>format_align_right</mat-icon>
                    </button>
                    <button mat-icon-button type="button" (click)="formatDoc('justifyCenter')" matTooltip="وسط چین">
                      <mat-icon>format_align_center</mat-icon>
                    </button>
                    <button mat-icon-button type="button" (click)="formatDoc('justifyLeft')" matTooltip="چپ چین">
                      <mat-icon>format_align_left</mat-icon>
                    </button>
                  </div>
  
                  <div class="toolbar-divider"></div>
  
                  <div class="toolbar-group">
                    <button mat-icon-button type="button" (click)="formatDoc('insertUnorderedList')" matTooltip="لیست">
                      <mat-icon>format_list_bulleted</mat-icon>
                    </button>
                    <button mat-icon-button type="button" (click)="formatDoc('insertOrderedList')" matTooltip="لیست شماره‌دار">
                      <mat-icon>format_list_numbered</mat-icon>
                    </button>
                  </div>
  
                  <div class="toolbar-divider"></div>
  
                  <div class="toolbar-group">
                    <button mat-icon-button type="button" (click)="formatDoc('createLink')" matTooltip="افزودن لینک">
                      <mat-icon>link</mat-icon>
                    </button>
                  </div>
                </div>
                
                <div 
                  #editor 
                  class="editor-content" 
                  contenteditable="true"
                  (input)="onEditorInput($event)"
                  dir="rtl"
                ></div>
              </mat-card-content>
            </mat-card>
          </div>
  
          <!-- Redirect Link -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>لینک مرتبط</mat-label>
            <input matInput formControlName="redirectLink" placeholder="لینک مرتبط را وارد کنید">
          </mat-form-field>
  
          <!-- Search Words -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>کلمات کلیدی</mat-label>
            <mat-chip-grid #chipGrid>
              <mat-chip-row
                *ngFor="let word of searchWords"
                (removed)="removeSearchWord(word)">
                {{word}}
                <button matChipRemove>
                  <mat-icon>cancel</mat-icon>
                </button>
              </mat-chip-row>
            </mat-chip-grid>
            <input
              placeholder="کلمه کلیدی جدید..."
              [matChipInputFor]="chipGrid"
              [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
              (matChipInputTokenEnd)="addSearchWord($event)">
          </mat-form-field>
  
          <!-- File Upload -->
          <div class="file-upload">
            <label class="form-label">فایل‌ها</label>
            <div class="upload-zone" (click)="fileInput.click()">
              <input
                #fileInput
                type="file"
                multiple
                (change)="onFileSelected($event)"
                style="display: none">
              <mat-icon>cloud_upload</mat-icon>
              <span>برای آپلود فایل کلیک کنید یا فایل را اینجا رها کنید</span>
            </div>
  
            <!-- File List -->
            <div class="file-list" *ngIf="files.length > 0">
              <div *ngFor="let file of files; let i = index" class="file-item">
                <span>{{ file.name }}</span>
                <button mat-icon-button (click)="removeFile(i)">
                  <mat-icon>close</mat-icon>
                </button>
              </div>
            </div>
          </div>
  
          <!-- Submit Buttons -->
          <div class="actions">
            <button mat-stroked-button type="button" (click)="goBack()">
              <mat-icon>arrow_forward</mat-icon>
              برگشت
            </button>
            <button
              mat-flat-button
              color="primary"
              type="submit"
              [disabled]="!noteForm.valid || loading">
              <mat-icon>save</mat-icon>
              {{ loading ? 'در حال ثبت...' : 'ثبت جزوه' }}
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
