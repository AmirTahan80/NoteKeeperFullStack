<main class="profile-page">
  <section class="profile-card" *ngIf="loading">
    <p>Loading profile...</p>
  </section>

  <section class="profile-card" *ngIf="!loading && !notFound">
    <div class="avatar" aria-hidden="true">{{ userName.charAt(0).toUpperCase() }}</div>
    <p class="label">Public username</p>
    <h1>&#64;{{ userName }}</h1>
    <p class="privacy-note">
      This user's email and other private profile details are hidden.
    </p>
  </section>

  <section class="profile-card" *ngIf="!loading && notFound">
    <h1>User not found</h1>
    <a routerLink="/">Back to home</a>
  </section>
</main>
