<main class="profile-page" dir="rtl">
  <section class="profile-card" *ngIf="loading">
    <p>در حال دریافت پروفایل...</p>
  </section>

  <section class="profile-card" *ngIf="!loading && !notFound">
    <div class="avatar" aria-hidden="true">{{ userName.charAt(0).toUpperCase() }}</div>
    <p class="label">نام کاربری عمومی</p>
    <h1 dir="ltr">&#64;{{ userName }}</h1>
    <p class="privacy-note">
      ایمیل و سایر اطلاعات خصوصی این کاربر نمایش داده نمی‌شود.
    </p>
  </section>

  <section class="profile-card" *ngIf="!loading && notFound">
    <h1>کاربر پیدا نشد</h1>
    <a routerLink="/">بازگشت به خانه</a>
  </section>
</main>
