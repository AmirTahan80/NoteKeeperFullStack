<!-- home.component.html -->
<div class="home-container">
    <!-- Background Pattern -->
    <div class="background-pattern"></div>
  
    <!-- Main Content -->
    <div class="content-container" [@fadeIn]>
      <!-- Header Section -->
      <div class="header-section">
        <h1 class="main-title">نوت هاتو بزار جا ما</h1>
        <p class="subtitle">با قابلیت جست و جو توی جزوت میتونی</p>
        <p class="extra-text">دنیارو بدست بیاری</p>
      </div>
  
      <!-- Welcome Section -->
      <div class="welcome-section">
        <h2 class="welcome-title">به نوت کیپر خوش اومدی</h2>
        <p class="welcome-description">
          در اینجا میتونی نوت هاتو نگه داری و توشون جست و جو کنی، فقط کافیه
          از منو نوت جدید رو انتخاب کنی
        </p>
        
        <!-- Action Button -->
        <button class="new-note-btn" (click)="navigateToNewNote()">
          <span class="btn-text">شروع نوت جدید</span>
          <span class="btn-icon">←</span>
        </button>
      </div>
    </div>
  </div>
