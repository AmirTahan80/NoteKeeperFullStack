<!-- home.component.html -->
<div class="home-container">
    <!-- Background Pattern -->
    <div class="background-pattern"></div>
  
    <!-- Main Content -->
    <div class="content-container" [@fadeIn]>
      <!-- Header Section -->
      <div class="header-section">
        <h1 class="main-title">Keep every idea within reach</h1>
        <p class="subtitle">Organize your notes and find anything in seconds.</p>
        <p class="extra-text">Your knowledge, always ready when you need it.</p>
      </div>
  
      <!-- Welcome Section -->
      <div class="welcome-section">
        <h2 class="welcome-title">Welcome to NoteKeeper</h2>
        <p class="welcome-description">
          Create categories, save detailed notes, attach files, and search your content whenever you need it.
        </p>
        
        <!-- Action Button -->
        <button class="new-note-btn" (click)="navigateToNewNote()">
          <span class="btn-text">Create a category</span>
          <span class="btn-icon">→</span>
        </button>
      </div>
    </div>
  </div>
