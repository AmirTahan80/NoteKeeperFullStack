<!-- features/notes/create-note/create-note.component.html -->
<div class="create-note-container">
    <mat-card class="note-card">
      <mat-card-header>
        <mat-card-title>Create a category</mat-card-title>
        <mat-card-subtitle>Enter a name and an optional description.</mat-card-subtitle>
      </mat-card-header>
  
      <mat-card-content>
        <form [formGroup]="noteForm" 
              (ngSubmit)="onSubmit()" 
              class="note-form"
              autocomplete="off">
          
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Category name</mat-label>
            <input matInput
                   formControlName="subject"
                   placeholder="Enter a category name">
            <mat-error *ngIf="noteForm.get('subject')?.hasError('required')">
              A category name is required
            </mat-error>
            <mat-error *ngIf="noteForm.get('subject')?.hasError('minlength')">
              The category name must contain at least 3 characters
            </mat-error>
          </mat-form-field>
  
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Description</mat-label>
            <textarea matInput
                      formControlName="description"
                      placeholder="Add an optional description"
                      rows="8"
                      cdkTextareaAutosize
                      cdkAutosizeMinRows="8"
                      cdkAutosizeMaxRows="15">
            </textarea>
          </mat-form-field>
  
          <div class="button-container">
            <button mat-flat-button
                    color="primary"
                    type="submit"
                    [disabled]="!noteForm.valid || isLoading">
              <mat-icon>save</mat-icon>
              <span>Create category</span>
            </button>
            
            <button mat-stroked-button
                    type="button"
                    (click)="noteForm.reset()"
                    [disabled]="isLoading">
              <mat-icon>refresh</mat-icon>
              <span>Clear</span>
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  
    <app-loading-overlay 
      *ngIf="isLoading"
      message="Creating category...">
    </app-loading-overlay>
  </div>
