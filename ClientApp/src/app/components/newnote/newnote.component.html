<!-- features/notes/create-note/create-note.component.html -->
<div class="create-note-container">
    <mat-card class="note-card">
      <mat-card-header>
        <mat-card-title>افزودن موضوع نوت</mat-card-title>
        <mat-card-subtitle>لطفاً اطلاعات نوت خود را وارد کنید</mat-card-subtitle>
      </mat-card-header>
  
      <mat-card-content>
        <form [formGroup]="noteForm" 
              (ngSubmit)="onSubmit()" 
              class="note-form"
              autocomplete="off">
          
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>موضوع</mat-label>
            <input matInput
                   formControlName="subject"
                   placeholder="موضوع را وارد کنید">
            <mat-error *ngIf="noteForm.get('subject')?.hasError('required')">
              موضوع اجباری است
            </mat-error>
            <mat-error *ngIf="noteForm.get('subject')?.hasError('minlength')">
              موضوع باید حداقل ۳ حرف باشد
            </mat-error>
          </mat-form-field>
  
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>توضیحات</mat-label>
            <textarea matInput
                      formControlName="description"
                      placeholder="توضیحات خود را بنویسید"
                      rows="8"
                      cdkTextareaAutosize
                      cdkAutosizeMinRows="8"
                      cdkAutosizeMaxRows="15">
            </textarea>
          </mat-form-field>
  
          <div class="button-container">
            <button mat-flat-button
                    color="primary"
                    type="submit"
                    [disabled]="!noteForm.valid || isLoading">
              <mat-icon>save</mat-icon>
              <span>ثبت نوت</span>
            </button>
            
            <button mat-stroked-button
                    type="button"
                    (click)="noteForm.reset()"
                    [disabled]="isLoading">
              <mat-icon>refresh</mat-icon>
              <span>پاک کردن</span>
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  
    <app-loading-overlay 
      *ngIf="isLoading"
      message="در حال ذخیره نوت...">
    </app-loading-overlay>
  </div>
