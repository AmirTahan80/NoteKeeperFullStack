services:
  notebookkeeper.api:
    image: notebookkeeper-api
    build:
      context: .
      dockerfile: NoteBookKeeper.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=NoteBookKeeperDb;User=sa;Password=REDACTED_PASSWORD
      - MinioEndpoint=http://minio:9000
      - MinioAccessKey=AmirTahan80
      - MinioSecretKey=REDACTED_PASSWORD
    depends_on:
      - sqlserver
      - minio
  
  sqlserver:
    image: mcr.microsoft.com/mssql/server:latest
    environment:
      - SA_PASSWORD=REDACTED_PASSWORD
      - ACCEPT_EULA=Y
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  minio:
    image: minio/minio
    command: server /data
    environment:
      - MINIO_ROOT_USER=AmirTahan80
      - MINIO_ROOT_PASSWORD=REDACTED_PASSWORD
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/var/opt/minio-files

  nginx:
    image: nginx:alpine
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
    ports:
      - "80:80"
    depends_on:
      - notebookkeeper.api

volumes:
    sqlserver-data:
    minio-data: