services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notekeeper
      POSTGRES_USER: notekeeper
      POSTGRES_PASSWORD: notekeeper_dev
    ports:
      - "5432:5432"
    volumes:
      - notekeeper-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notekeeper -d notekeeper"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=notekeeper;Username=notekeeper;Password=notekeeper_dev
      Jwt__Key: local-docker-development-key-change-me-12345678901234567890
      Jwt__Issuer: NoteKeeper
      Jwt__Audience: NoteKeeper
    ports:
      - "8080:10000"
    depends_on:
      database:
        condition: service_healthy

volumes:
  notekeeper-data:
