<div class="register-container" dir="rtl">
    <mat-card class="register-card">
        <mat-card-header>
            <mat-card-title>ثبت نام</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form class="register-form" (ngSubmit)="register()">
                <mat-form-field appearance="fill">
                    <mat-label>نام کاربری</mat-label>
                    <input matInput type="text" [(ngModel)]="userName" name="username" required>
                </mat-form-field>
                <mat-form-field appearance="fill">
                    <mat-label>ایمیل</mat-label>
                    <input matInput type="email"[(ngModel)]="email"  name="email" required>
                </mat-form-field>
                <mat-form-field appearance="fill">
                    <mat-label>رمز عبور</mat-label>
                    <input matInput type="password" [(ngModel)]="password" name="password" required>
                </mat-form-field>
                <mat-form-field appearance="fill">
                    <mat-label>تکرار رمز عبور</mat-label>
                    <input matInput type="repassword" [(ngModel)]="repassword" name="repassword" required>
                </mat-form-field>
                <button mat-raised-button color="primary" type="submit">
                    ثبت نام
                </button>
            </form>
        </mat-card-content>
    </mat-card>
</div>
